[project]
name = "aulaweb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.15.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check'
run = 'fastapi dev app/main.py'
format = 'ruff format'
test = 'pytest -s -x --cov=app -vv'
pre_format = 'ruff check --fix'
# pre_test = 'task lint'
post_test = 'coverage html'
